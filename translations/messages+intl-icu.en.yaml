Confidentialité: Privacy
'BxlEvent accorde une grande importance à la protection de vos données personnelles. Cette page explique quelles données nous collectons, pourquoi, et quels sont vos droits.': 'BxlEvent attaches great importance to the protection of your personal data. This page explains what data we collect, why, and what your rights are.'
'1. Données collectées': '1. Data collected'
"Lors de votre inscription et de l'utilisation du site, nous collectons les informations suivantes : nom, prénom, adresse e-mail, adresse postale (facultative) et, le cas échéant, les informations liées à vos commandes et billets.": 'When you register and use the site, we collect the following information: last name, first name, email address, postal address (optional) and, where applicable, information related to your orders and tickets.'
'2. Utilisation des données': '2. Use of data'
'Ces données sont utilisées uniquement pour :': 'This data is used solely to:'
'Créer et gérer votre compte utilisateur ;': 'Create and manage your user account;'
'Traiter vos commandes et générer vos billets ;': 'Process your orders and generate your tickets;'
'Vous envoyer la newsletter, si vous y êtes inscrit ;': 'Send you the newsletter, if you are subscribed;'
'Répondre à vos demandes via le formulaire de contact.': 'Respond to your requests via the contact form.'
'3. Conservation des données': '3. Data retention'
'Vos données sont conservées uniquement le temps nécessaire aux finalités décrites ci-dessus, et supprimées  à la clôture de votre compte.': 'Your data is kept only for as long as necessary for the purposes described above, and is deleted when your account is closed.'
'4. Vos droits': '4. Your rights'
"Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et de suppression de vos données. Vous pouvez à tout moment consulter et modifier vos informations depuis votre profil, ou nous contacter directement pour toute demande.": 'In accordance with the GDPR, you have the right to access, rectify and delete your data. You can view and edit your information from your profile at any time, or contact us directly with any request.'
'5. Cookies': '5. Cookies'
"BxlEvent utilise uniquement des cookies techniques nécessaires au bon fonctionnement du site (ex : maintien de votre session et de votre panier). Aucun cookie publicitaire n'est utilisé.": 'BxlEvent only uses technical cookies necessary for the proper functioning of the site (e.g. keeping your session and cart). No advertising cookies are used.'
'6. Base légale du traitement': '6. Legal basis for processing'
'Les données personnelles sont traitées sur la base de différentes fondements juridiques prévus par le RGPD :.': 'Personal data is processed on the basis of various legal grounds provided for by the GDPR:.'
"l'exécution d'un contrat, notamment pour la création du compte et la gestion des commandes ;": 'the performance of a contract, in particular for account creation and order management;'
"le consentement de l'utilisateur, notamment pour l'inscription à la newsletter ;": "the user's consent, in particular for newsletter subscription;"
"le respect d'obligations légales lorsque cela est nécessaire ;": 'compliance with legal obligations where necessary;'
"l'intérêt légitime de BxlEvent pour assurer la sécurité et le bon fonctionnement du site.": "BxlEvent's legitimate interest in ensuring the security and proper functioning of the site."
'7. Destinataires des données': '7. Data recipients'
"Les données personnelles sont uniquement accessibles aux personnes nécessaires au fonctionnement de BxlEvent. Elles peuvent notamment être transmises à nos prestataires techniques lorsque cela est nécessaire au fonctionnement du site, au traitement des paiements ou à l'envoi d'e-mails.": "Personal data is only accessible to people necessary for the operation of BxlEvent. It may be shared with our technical service providers when necessary for the site's operation, payment processing or sending emails."
'8. Sécurité des données': '8. Data security'
"BxlEvent met en œuvre des mesures techniques et organisationnelles appropriées afin de protéger les données personnelles contre la perte, l'accès non autorisé, la modification ou la divulgation.": 'BxlEvent implements appropriate technical and organizational measures to protect personal data against loss, unauthorized access, alteration or disclosure.'
"9. Transfert des données hors de l'Union européenne": '9. Transfer of data outside the European Union'
"Lorsque certains prestataires utilisés par BxlEvent peuvent traiter des données personnelles en dehors de l'Union européenne, nous veillons à ce que ces transferts soient réalisés conformément aux exigences du RGPD et bénéficient de garanties appropriées.": 'Where certain service providers used by BxlEvent may process personal data outside the European Union, we ensure that such transfers are carried out in accordance with GDPR requirements and benefit from appropriate safeguards.'
'10. Modification de la politique de confidentialité': '10. Changes to the privacy policy'
"Cette politique de confidentialité peut être modifiée afin de tenir compte de l'évolution du site, de nos services ou de la réglementation applicable.": 'This privacy policy may be amended to reflect changes to the site, our services or applicable regulations.'
'La date de dernière mise à jour indiquée en haut de cette page permet de connaître la version actuellement en vigueur.': 'The last update date shown at the top of this page indicates the currently applicable version.'
