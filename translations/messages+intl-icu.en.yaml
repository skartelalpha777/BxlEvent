Conditions: Terms
"Conditions générales d'utilisation": 'General terms of use'
"Les présentes conditions générales régissent l'utilisation du site BxlEvent. En créant un compte ou en utilisant le site, vous acceptez sans réserve les conditions décrites ci-dessous.": 'These terms and conditions govern the use of the BxlEvent website. By creating an account or using the site, you fully accept the terms described below.'
'1. Objet': '1. Purpose'
'BxlEvent est une plateforme permettant de découvrir des événements organisés à Bruxelles et dans ses environs, de réserver des billets, et pour les Contributeurs, de publier et gérer leurs propres événements.': 'BxlEvent is a platform for discovering events organized in Brussels and its surroundings, booking tickets, and, for Contributors, publishing and managing their own events.'
"2. Création d'un compte": '2. Creating an account'
"L'utilisation de certaines fonctionnalités de BxlEvent (réservation de billets, publication d'événements, gestion du profil) nécessite la création d'un compte. Lors de l'inscription, vous devez choisir un profil :": 'Using certain features of BxlEvent (ticket booking, event publishing, profile management) requires creating an account. When registering, you must choose a profile:'
Membre: Member
': permet de parcourir les événements, réserver des billets et gérer ses commandes ;': ': allows you to browse events, book tickets and manage your orders;'
Contributeur: Contributor
': permet en plus de publier et gérer ses propres événements.': ': also allows you to publish and manage your own events.'
'Vous vous engagez à fournir des informations exactes, à jour, et à les maintenir à jour depuis votre profil. Vous êtes responsable de la confidentialité de votre mot de passe et de toute activité effectuée depuis votre compte.': 'You agree to provide accurate, up-to-date information and to keep it current from your profile. You are responsible for the confidentiality of your password and for any activity carried out from your account.'
'3. Comportement des utilisateurs': '3. User conduct'
'En utilisant BxlEvent, vous vous engagez à :': 'By using BxlEvent, you agree to:'
'Ne pas créer plusieurs comptes dans le but de contourner une restriction ;': 'Not create multiple accounts to circumvent a restriction;'
"Ne pas publier de contenu trompeur, injurieux, illicite ou portant atteinte aux droits d'autrui ;": 'Not publish misleading, abusive, unlawful content, or content infringing on the rights of others;'
"Ne pas utiliser le site à des fins frauduleuses (fausses réservations, faux événements, usurpation d'identité) ;": 'Not use the site for fraudulent purposes (fake bookings, fake events, identity theft);'
'Respecter les autres utilisateurs et organisateurs.': 'Respect other users and organizers.'
"Tout utilisateur constatant un comportement abusif ou un événement suspect peut le signaler directement depuis la page de l'événement concerné.": 'Any user noticing abusive behavior or a suspicious event can report it directly from the page of the event concerned.'
'4. Fonctionnement des événements': '4. How events work'
"Les événements affichés sur BxlEvent peuvent être créés par l'équipe BxlEvent ou publiés par des utilisateurs Contributeurs. Chaque événement passe par un statut de validation avant d'être visible publiquement, afin de limiter la publication de contenus non conformes.": 'Events shown on BxlEvent can be created by the BxlEvent team or published by Contributor users. Each event goes through a validation status before becoming publicly visible, in order to limit the publication of non-compliant content.'
"Les Contributeurs sont responsables de l'exactitude des informations qu'ils publient (description, date, heure, lieu, catégories, tarifs des billets). Il leur appartient de tenir ces informations à jour, notamment en cas de report ou d'annulation.": 'Contributors are responsible for the accuracy of the information they publish (description, date, time, location, categories, ticket prices). It is their responsibility to keep this information up to date, particularly in the event of postponement or cancellation.'
'5. Réservation et paiement des billets': '5. Ticket booking and payment'
"Toute commande de billets via BxlEvent est ferme dès sa confirmation. Les billets sont nominatifs et non transférables, sauf indication contraire de l'organisateur de l'événement. Après paiement, les billets sont accessibles au format PDF depuis votre profil.": 'Any ticket order placed via BxlEvent is final once confirmed. Tickets are personal and non-transferable, unless otherwise stated by the event organizer. After payment, tickets are available as a PDF from your profile.'
'6. Responsabilité de BxlEvent': "6. BxlEvent's liability"
"BxlEvent agit en tant qu'intermédiaire technique entre les organisateurs et les participants. À ce titre, BxlEvent ne peut être tenu responsable :": 'BxlEvent acts as a technical intermediary between organizers and participants. As such, BxlEvent cannot be held liable for:'
"Du déroulement, du report ou de l'annulation d'un événement, ces responsabilités incombant à l'organisateur ;": 'The running, postponement or cancellation of an event, as these responsibilities lie with the organizer;'
"De l'exactitude des informations publiées par les Contributeurs ;": 'The accuracy of information published by Contributors;'
"D'une interruption temporaire du site liée à la maintenance ou à un incident technique.": 'A temporary interruption of the site due to maintenance or a technical incident.'
'BxlEvent met cependant tout en œuvre pour vérifier les événements publiés et retirer rapidement tout contenu signalé comme non conforme.': 'BxlEvent nevertheless does everything possible to check published events and promptly remove any content reported as non-compliant.'
"7. Suspension et suppression d'un compte": '7. Suspension and deletion of an account'
'BxlEvent se réserve le droit de suspendre ou de supprimer, temporairement ou définitivement, tout compte ne respectant pas les présentes conditions générales, notamment en cas de comportement frauduleux, de publication de contenu non conforme ou de signalements répétés et justifiés.': 'BxlEvent reserves the right to temporarily or permanently suspend or delete any account that does not comply with these terms and conditions, particularly in the event of fraudulent behavior, publication of non-compliant content, or repeated and justified reports.'
'Vous pouvez également demander la suppression de votre compte à tout moment, en nous contactant via notre page de contact.': 'You can also request the deletion of your account at any time by contacting us via our contact page.'
'8. Propriété intellectuelle': '8. Intellectual property'
"L'ensemble des contenus du site (textes, logo, mise en page, charte graphique) est protégé et ne peut être reproduit sans autorisation préalable. Les contenus publiés par les Contributeurs (descriptions, visuels d'événements) restent leur propriété, mais sont mis à disposition de BxlEvent pour affichage sur la plateforme.": 'All content on the site (texts, logo, layout, graphic style) is protected and may not be reproduced without prior authorization. Content published by Contributors (descriptions, event visuals) remains their property but is made available to BxlEvent for display on the platform.'
'9. Données personnelles': '9. Personal data'
