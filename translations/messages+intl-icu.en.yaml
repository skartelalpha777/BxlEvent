'À propos': About
'A propos de BxlEvent': 'About BxlEvent'
'BxlEvent est une plateforme dédiée aux événements récréatifs à Bruxelles et dans ses environs.': 'BxlEvent is a platform dedicated to recreational events in Brussels and its surroundings.'
'Notre objectif est de vous aider à découvrir facilement les activités et sorties qui correspondent à vos envies.': 'Our goal is to help you easily discover activities and outings that match your interests.'
'Notre projet': 'Our project'
'Une plateforme pensée pour découvrir Bruxelles autrement': 'A platform designed to discover Brussels differently'
"BxlEvent a été développé dans le cadre d'un projet scolaire avec l'objectif de créer une plateforme permettant de centraliser différents événements récréatifs organisés à Bruxelles.": 'BxlEvent was developed as part of a school project with the goal of creating a platform to centralize various recreational events organized in Brussels.'
'Concerts, festivals, spectacles, expositions, événements sportifs ou encore activités de loisirs : notre plateforme rassemble différentes possibilités de sorties au même endroit.': 'Concerts, festivals, shows, exhibitions, sporting events or leisure activities: our platform brings together different outing options in one place.'
'Nous avons voulu proposer une interface simple et intuitive afin que chacun puisse trouver rapidement un événement, consulter ses informations et découvrir de nouvelles activités.': 'We wanted to offer a simple and intuitive interface so that everyone can quickly find an event, view its details and discover new activities.'
'Pourquoi BxlEvent ?': 'Why BxlEvent?'
"Bruxelles, une ville pleine d'événements": 'Brussels, a city full of events'
"Bruxelles propose de nombreuses activités tout au long de l'année. Pourtant, trouver un événement qui correspond à ses envies peut parfois nécessiter de consulter plusieurs sites.": 'Brussels offers many activities throughout the year. However, finding an event that matches your interests can sometimes require checking several websites.'
'BxlEvent a donc été imaginé pour simplifier cette recherche. Grâce aux catégories, aux filtres et aux informations détaillées de chaque événement, vous pouvez facilement explorer les sorties disponibles et préparer votre prochaine activité.': 'BxlEvent was therefore designed to simplify this search. Thanks to categories, filters and detailed information for each event, you can easily explore the available outings and plan your next activity.'
'Ce que vous pouvez trouver sur BxlEvent': 'What you can find on BxlEvent'
'Concerts & festivals': 'Concerts & festivals'
'Découvrez les artistes et événements musicaux qui se déroulent à Bruxelles.': 'Discover the artists and music events taking place in Brussels.'
'Spectacles & culture': 'Shows & culture'
'Théâtre, spectacles, expositions et autres rendez-vous culturels à ne pas manquer.': 'Theatre, shows, exhibitions and other cultural events not to be missed.'
'Sports & loisirs': 'Sports & leisure'
'Retrouvez les événements sportifs et activités de loisirs proposés dans la capitale.': 'Find the sporting events and leisure activities on offer in the capital.'
'Sorties & activités': 'Outings & activities'
'Des idées de sorties pour profiter de Bruxelles seul, entre amis ou en famille.': 'Ideas for outings to enjoy Brussels alone, with friends or family.'
'Tout pour': 'Everything to'
'Vous aider à trouver votre prochaine sortie': 'help you find your next outing'
"Nous avons à cœur de rendre la recherche d'événements plus simple, claire et plus agréable. BxlEvent permet de parcourir les événements selon différents critères comme la catégorie, la date ou le lieu afin de trouver plus rapidement une activité qui vous correspond.": 'We care about making the search for events simpler, clearer and more enjoyable. BxlEvent lets you browse events by different criteria such as category, date or location, so you can more quickly find an activity that suits you.'
"Une sélection d'événements récréatifs de qualité": 'A selection of quality recreational events'
'Des informations claires et mises à jour régulièrement': 'Clear information updated regularly'
'Une interface simple, rapide et accessible à tous': 'A simple, fast interface accessible to everyone'
"Un projet réalisé avec passion et envie d'apprendre": 'A project made with passion and a desire to learn'
'Une sortie vous attend peut-être!': 'An outing might be waiting for you!'
'Parcourez les évènements disponibles à Bruxelles et trouvez votre prochaine activité en quelques clics': 'Browse the events available in Brussels and find your next activity in just a few clicks'
'Découvrez les évènements': 'Discover the events'
'Foire aux questions': 'Frequently asked questions'
'Retrouvez ici les réponses aux questions les plus fréquentes à propos de BxlEvent.': 'Find here the answers to the most frequently asked questions about BxlEvent.'
'Comment créer un compte sur BxlEvent ?': 'How do I create an account on BxlEvent?'
'Cliquez sur "S''inscrire" dans  de la page de connexion, remplissez le formulaire avec vos informations et validez votre inscription via l''e-mail que vous recevrez. Une fois votre compte activé, vous pourrez profiter de toutes les fonctionnalités.': 'Click "Sign up" on the login page, fill in the form with your details and confirm your registration via the email you receive. Once your account is activated, you can enjoy all the features.'
'Comment réserver un événement ?': 'How do I book an event?'
"Rendez-vous sur la page de l'événement qui vous intéresse, choisissez votre type de billet et la quantité, puis ajoutez-le au panier. Vous pourrez ensuite finaliser votre commande depuis votre panier.": "Go to the page of the event you're interested in, choose your ticket type and quantity, then add it to your cart. You can then complete your order from your cart."
'Puis-je annuler ou modifier ma réservation ?': 'Can I cancel or change my booking?'
"Les billets sont non remboursables sauf en cas d'annulation de l'événement.": 'Tickets are non-refundable, except if the event is cancelled.'
'Quels moyens de paiement acceptez-vous ?': 'What payment methods do you accept?'
'BxlEvent accepte les principales cartes bancaires ainsi que les moyens de paiement en ligne les plus courants. Toutes les transactions sont sécurisées.': 'BxlEvent accepts major bank cards as well as the most common online payment methods. All transactions are secure.'
'Comment être informé des nouveaux événements ?': 'How can I be notified about new events?'
"Inscrivez-vous à notre newsletter depuis la page d'accueil pour recevoir chaque semaine une sélection des meilleurs événements à ne pas manquer à Bruxelles.": 'Sign up for our newsletter from the homepage to receive a weekly selection of the best events not to miss in Brussels.'
'Mes données sont-elles sécurisées ?': 'Is my data secure?'
'Oui. Vos données personnelles et vos paiements sont traités de manière sécurisée et ne sont jamais partagés avec des tiers sans votre consentement.': 'Yes. Your personal data and payments are processed securely and are never shared with third parties without your consent.'
"Je n'ai pas trouvé la réponse à ma question, que faire ?": "I couldn't find the answer to my question, what should I do?"
"N'hésitez pas à nous contacter directement via notre page de contact, notre équipe se fera un plaisir de vous répondre rapidement.": 'Feel free to contact us directly via our contact page, our team will be happy to reply quickly.'
'Comment télécharger mes billets ?': 'How do I download my tickets?'
'Rendez-vous dans votre profil, section "Mes commandes & billets". Pour chaque commande payée, un bouton "Télécharger mes billets" vous permet de récupérer vos billets au format PDF.': 'Go to your profile, "My orders & tickets" section. For each paid order, a "Download my tickets" button lets you retrieve your tickets as a PDF.'
'Comment devenir organisateur et publier mon propre événement ?': 'How do I become an organizer and publish my own event?'
'Lors de votre inscription, choisissez le profil "Contributeur (Organisateur)". Vous pourrez ensuite publier vos propres événements et gérer votre programmation depuis votre compte.': 'When registering, choose the "Contributor (Organizer)" profile. You can then publish your own events and manage your schedule from your account.'
'Comment signaler un problème avec un événement ?': 'How do I report a problem with an event?'
'Si un événement vous semble incorrect, annulé ou frauduleux, vous pouvez le signaler directement depuis sa page. Notre équipe examine chaque signalement et vous tient informé du traitement de votre demande.': 'If an event seems incorrect, cancelled or fraudulent, you can report it directly from its page. Our team reviews every report and keeps you informed of how your request is handled.'
'Vous avez encore une question ?': 'Still have a question?'
"Notre équipe est là pour vous aider. N'hésitez pas à nous contacter.": 'Our team is here to help. Feel free to contact us.'
'Nous contacter': 'Contact us'
'Une question sur un événement à Bruxelles ? Notre équipe vous répond dans les plus brefs délais.': 'A question about an event in Brussels? Our team will respond as soon as possible.'
'Contact Info': 'Contact Info'
'Retrouvez-nous au cœur de la capitale ou contactez-nous directement.': 'Find us in the heart of the capital or contact us directly.'
'Notre Localisation': 'Our Location'
