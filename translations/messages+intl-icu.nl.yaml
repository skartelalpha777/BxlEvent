Confidentialité: Privacy
'BxlEvent accorde une grande importance à la protection de vos données personnelles. Cette page explique quelles données nous collectons, pourquoi, et quels sont vos droits.': 'BxlEvent hecht veel belang aan de bescherming van uw persoonsgegevens. Deze pagina legt uit welke gegevens wij verzamelen, waarom, en wat uw rechten zijn.'
'1. Données collectées': '1. Verzamelde gegevens'
"Lors de votre inscription et de l'utilisation du site, nous collectons les informations suivantes : nom, prénom, adresse e-mail, adresse postale (facultative) et, le cas échéant, les informations liées à vos commandes et billets.": 'Bij uw registratie en het gebruik van de site verzamelen wij de volgende gegevens: naam, voornaam, e-mailadres, postadres (facultatief) en, indien van toepassing, informatie met betrekking tot uw bestellingen en tickets.'
'2. Utilisation des données': '2. Gebruik van de gegevens'
'Ces données sont utilisées uniquement pour :': 'Deze gegevens worden uitsluitend gebruikt om:'
'Créer et gérer votre compte utilisateur ;': 'Uw gebruikersaccount aan te maken en te beheren;'
'Traiter vos commandes et générer vos billets ;': 'Uw bestellingen te verwerken en uw tickets te genereren;'
'Vous envoyer la newsletter, si vous y êtes inscrit ;': 'U de nieuwsbrief te sturen, indien u hierop bent geabonneerd;'
'Répondre à vos demandes via le formulaire de contact.': 'Te reageren op uw verzoeken via het contactformulier.'
'3. Conservation des données': '3. Bewaring van de gegevens'
'Vos données sont conservées uniquement le temps nécessaire aux finalités décrites ci-dessus, et supprimées  à la clôture de votre compte.': 'Uw gegevens worden enkel bewaard zolang nodig is voor de hierboven beschreven doeleinden, en verwijderd bij sluiting van uw account.'
'4. Vos droits': '4. Uw rechten'
"Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et de suppression de vos données. Vous pouvez à tout moment consulter et modifier vos informations depuis votre profil, ou nous contacter directement pour toute demande.": 'Overeenkomstig de AVG heeft u recht op inzage, rectificatie en verwijdering van uw gegevens. U kunt op elk moment uw gegevens raadplegen en wijzigen via uw profiel, of ons rechtstreeks contacteren voor elk verzoek.'
'5. Cookies': '5. Cookies'
"BxlEvent utilise uniquement des cookies techniques nécessaires au bon fonctionnement du site (ex : maintien de votre session et de votre panier). Aucun cookie publicitaire n'est utilisé.": 'BxlEvent gebruikt uitsluitend technische cookies die nodig zijn voor de goede werking van de site (bv.: het behoud van uw sessie en winkelmandje). Er worden geen reclamecookies gebruikt.'
'6. Base légale du traitement': '6. Rechtsgrondslag van de verwerking'
'Les données personnelles sont traitées sur la base de différentes fondements juridiques prévus par le RGPD :.': 'Persoonsgegevens worden verwerkt op basis van verschillende rechtsgrondslagen die door de AVG worden voorzien:.'
"l'exécution d'un contrat, notamment pour la création du compte et la gestion des commandes ;": 'de uitvoering van een overeenkomst, met name voor het aanmaken van het account en het beheer van bestellingen;'
"le consentement de l'utilisateur, notamment pour l'inscription à la newsletter ;": 'de toestemming van de gebruiker, met name voor de inschrijving op de nieuwsbrief;'
"le respect d'obligations légales lorsque cela est nécessaire ;": 'de naleving van wettelijke verplichtingen indien nodig;'
"l'intérêt légitime de BxlEvent pour assurer la sécurité et le bon fonctionnement du site.": 'het gerechtvaardigd belang van BxlEvent om de veiligheid en de goede werking van de site te waarborgen.'
'7. Destinataires des données': '7. Ontvangers van de gegevens'
"Les données personnelles sont uniquement accessibles aux personnes nécessaires au fonctionnement de BxlEvent. Elles peuvent notamment être transmises à nos prestataires techniques lorsque cela est nécessaire au fonctionnement du site, au traitement des paiements ou à l'envoi d'e-mails.": 'Persoonsgegevens zijn uitsluitend toegankelijk voor personen die nodig zijn voor de werking van BxlEvent. Ze kunnen worden doorgegeven aan onze technische dienstverleners wanneer dit nodig is voor de werking van de site, de verwerking van betalingen of het versturen van e-mails.'
'8. Sécurité des données': '8. Beveiliging van de gegevens'
"BxlEvent met en œuvre des mesures techniques et organisationnelles appropriées afin de protéger les données personnelles contre la perte, l'accès non autorisé, la modification ou la divulgation.": 'BxlEvent neemt passende technische en organisatorische maatregelen om persoonsgegevens te beschermen tegen verlies, ongeoorloofde toegang, wijziging of openbaarmaking.'
"9. Transfert des données hors de l'Union européenne": '9. Doorgifte van gegevens buiten de Europese Unie'
"Lorsque certains prestataires utilisés par BxlEvent peuvent traiter des données personnelles en dehors de l'Union européenne, nous veillons à ce que ces transferts soient réalisés conformément aux exigences du RGPD et bénéficient de garanties appropriées.": 'Wanneer bepaalde door BxlEvent gebruikte dienstverleners persoonsgegevens buiten de Europese Unie kunnen verwerken, zorgen wij ervoor dat deze doorgiftes gebeuren in overeenstemming met de vereisten van de AVG en voorzien zijn van passende waarborgen.'
'10. Modification de la politique de confidentialité': '10. Wijziging van het privacybeleid'
"Cette politique de confidentialité peut être modifiée afin de tenir compte de l'évolution du site, de nos services ou de la réglementation applicable.": 'Dit privacybeleid kan worden gewijzigd om rekening te houden met de evolutie van de site, onze diensten of de toepasselijke regelgeving.'
'La date de dernière mise à jour indiquée en haut de cette page permet de connaître la version actuellement en vigueur.': 'De datum van de laatste update, bovenaan deze pagina, geeft aan welke versie momenteel van kracht is.'
'11. Contact': '11. Contact'
'Pour toute question concernant vos données personnelles, vous pouvez nous contacter via notre': 'Voor vragen over uw persoonsgegevens kunt u ons contacteren via onze'
Conditions: Voorwaarden
"Conditions générales d'utilisation": 'Algemene gebruiksvoorwaarden'
"Les présentes conditions générales régissent l'utilisation du site BxlEvent. En créant un compte ou en utilisant le site, vous acceptez sans réserve les conditions décrites ci-dessous.": 'Deze algemene voorwaarden regelen het gebruik van de website BxlEvent. Door een account aan te maken of de site te gebruiken, aanvaardt u zonder voorbehoud de hieronder beschreven voorwaarden.'
'1. Objet': '1. Doel'
'BxlEvent est une plateforme permettant de découvrir des événements organisés à Bruxelles et dans ses environs, de réserver des billets, et pour les Contributeurs, de publier et gérer leurs propres événements.': 'BxlEvent is een platform waarmee u evenementen in Brussel en omgeving kunt ontdekken, tickets kunt reserveren, en waarmee Bijdragers hun eigen evenementen kunnen publiceren en beheren.'
"2. Création d'un compte": '2. Aanmaken van een account'
"L'utilisation de certaines fonctionnalités de BxlEvent (réservation de billets, publication d'événements, gestion du profil) nécessite la création d'un compte. Lors de l'inscription, vous devez choisir un profil :": 'Het gebruik van bepaalde functies van BxlEvent (ticketreservering, publicatie van evenementen, profielbeheer) vereist het aanmaken van een account. Bij de registratie moet u een profiel kiezen:'
Membre: Lid
': permet de parcourir les événements, réserver des billets et gérer ses commandes ;': ': maakt het mogelijk om evenementen te bekijken, tickets te reserveren en bestellingen te beheren;'
Contributeur: Bijdrager
': permet en plus de publier et gérer ses propres événements.': ': maakt het bovendien mogelijk om eigen evenementen te publiceren en te beheren.'
'Vous vous engagez à fournir des informations exactes, à jour, et à les maintenir à jour depuis votre profil. Vous êtes responsable de la confidentialité de votre mot de passe et de toute activité effectuée depuis votre compte.': 'U verbindt zich ertoe juiste en actuele informatie te verstrekken en deze up-to-date te houden via uw profiel. U bent verantwoordelijk voor de vertrouwelijkheid van uw wachtwoord en voor elke activiteit die vanaf uw account wordt uitgevoerd.'
'3. Comportement des utilisateurs': '3. Gedrag van gebruikers'
'En utilisant BxlEvent, vous vous engagez à :': 'Door BxlEvent te gebruiken, verbindt u zich ertoe om:'
'Ne pas créer plusieurs comptes dans le but de contourner une restriction ;': 'Geen meerdere accounts aan te maken om een beperking te omzeilen;'
"Ne pas publier de contenu trompeur, injurieux, illicite ou portant atteinte aux droits d'autrui ;": 'Geen misleidende, beledigende, onwettige inhoud te publiceren of inhoud die de rechten van anderen schendt;'
"Ne pas utiliser le site à des fins frauduleuses (fausses réservations, faux événements, usurpation d'identité) ;": 'De site niet te gebruiken voor frauduleuze doeleinden (valse reserveringen, valse evenementen, identiteitsdiefstal);'
'Respecter les autres utilisateurs et organisateurs.': 'De andere gebruikers en organisatoren te respecteren.'
"Tout utilisateur constatant un comportement abusif ou un événement suspect peut le signaler directement depuis la page de l'événement concerné.": 'Elke gebruiker die ongepast gedrag of een verdacht evenement opmerkt, kan dit rechtstreeks melden vanaf de pagina van het betreffende evenement.'
'4. Fonctionnement des événements': '4. Werking van de evenementen'
"Les événements affichés sur BxlEvent peuvent être créés par l'équipe BxlEvent ou publiés par des utilisateurs Contributeurs. Chaque événement passe par un statut de validation avant d'être visible publiquement, afin de limiter la publication de contenus non conformes.": 'De evenementen op BxlEvent kunnen worden aangemaakt door het BxlEvent-team of gepubliceerd door Bijdragers. Elk evenement doorloopt een goedkeuringsstatus voordat het publiekelijk zichtbaar wordt, om de publicatie van niet-conforme inhoud te beperken.'
"Les Contributeurs sont responsables de l'exactitude des informations qu'ils publient (description, date, heure, lieu, catégories, tarifs des billets). Il leur appartient de tenir ces informations à jour, notamment en cas de report ou d'annulation.": 'Bijdragers zijn verantwoordelijk voor de juistheid van de informatie die zij publiceren (beschrijving, datum, tijdstip, locatie, categorieën, ticketprijzen). Het is hun verantwoordelijkheid om deze informatie up-to-date te houden, met name bij uitstel of annulering.'
'5. Réservation et paiement des billets': '5. Reservering en betaling van tickets'
"Toute commande de billets via BxlEvent est ferme dès sa confirmation. Les billets sont nominatifs et non transférables, sauf indication contraire de l'organisateur de l'événement. Après paiement, les billets sont accessibles au format PDF depuis votre profil.": 'Elke ticketbestelling via BxlEvent is definitief zodra deze bevestigd is. Tickets zijn persoonsgebonden en niet overdraagbaar, tenzij de organisator van het evenement anders aangeeft. Na betaling zijn de tickets als PDF beschikbaar vanuit uw profiel.'
'6. Responsabilité de BxlEvent': '6. Aansprakelijkheid van BxlEvent'
"BxlEvent agit en tant qu'intermédiaire technique entre les organisateurs et les participants. À ce titre, BxlEvent ne peut être tenu responsable :": 'BxlEvent treedt op als technische tussenpersoon tussen organisatoren en deelnemers. Als zodanig kan BxlEvent niet aansprakelijk worden gesteld voor:'
"Du déroulement, du report ou de l'annulation d'un événement, ces responsabilités incombant à l'organisateur ;": 'Het verloop, het uitstel of de annulering van een evenement, aangezien deze verantwoordelijkheden bij de organisator liggen;'
"De l'exactitude des informations publiées par les Contributeurs ;": 'De juistheid van de door Bijdragers gepubliceerde informatie;'
"D'une interruption temporaire du site liée à la maintenance ou à un incident technique.": 'Een tijdelijke onderbreking van de site door onderhoud of een technisch incident.'
'BxlEvent met cependant tout en œuvre pour vérifier les événements publiés et retirer rapidement tout contenu signalé comme non conforme.': 'BxlEvent doet echter al het mogelijke om gepubliceerde evenementen te controleren en gemelde niet-conforme inhoud snel te verwijderen.'
"7. Suspension et suppression d'un compte": '7. Schorsing en verwijdering van een account'
'BxlEvent se réserve le droit de suspendre ou de supprimer, temporairement ou définitivement, tout compte ne respectant pas les présentes conditions générales, notamment en cas de comportement frauduleux, de publication de contenu non conforme ou de signalements répétés et justifiés.': 'BxlEvent behoudt zich het recht voor om elk account dat deze algemene voorwaarden niet naleeft, tijdelijk of definitief te schorsen of te verwijderen, met name bij frauduleus gedrag, publicatie van niet-conforme inhoud of herhaalde en gegronde meldingen.'
'Vous pouvez également demander la suppression de votre compte à tout moment, en nous contactant via notre page de contact.': 'U kunt ook op elk moment de verwijdering van uw account aanvragen door ons te contacteren via onze contactpagina.'
'8. Propriété intellectuelle': '8. Intellectuele eigendom'
"L'ensemble des contenus du site (textes, logo, mise en page, charte graphique) est protégé et ne peut être reproduit sans autorisation préalable. Les contenus publiés par les Contributeurs (descriptions, visuels d'événements) restent leur propriété, mais sont mis à disposition de BxlEvent pour affichage sur la plateforme.": 'Alle inhoud van de site (teksten, logo, lay-out, grafisch charter) is beschermd en mag niet worden gereproduceerd zonder voorafgaande toestemming. Inhoud gepubliceerd door Bijdragers (beschrijvingen, visuals van evenementen) blijft hun eigendom, maar wordt aan BxlEvent ter beschikking gesteld voor weergave op het platform.'
'9. Données personnelles': '9. Persoonsgegevens'
'Le traitement de vos données personnelles est détaillé dans notre': 'De verwerking van uw persoonsgegevens wordt beschreven in ons'
'10. Modification des conditions': '10. Wijziging van de voorwaarden'
'BxlEvent se réserve le droit de modifier les présentes conditions générales à tout moment. La date de dernière mise à jour indiquée en haut de cette page permet de connaître la version en vigueur.': 'BxlEvent behoudt zich het recht voor om deze algemene voorwaarden op elk moment te wijzigen. De datum van de laatste update, bovenaan deze pagina, geeft aan welke versie van kracht is.'
'Pour toute question relative à ces conditions générales, vous pouvez nous contacter via notre': 'Voor vragen over deze algemene voorwaarden kunt u ons contacteren via onze'
