'5. Nature du site': '5. Aard van de site'
"BxlEvent est un projet initialement réalisé dans le cadre d'une formation à l'EPFC, dont le déploiement sur un serveur accessible publiquement fait partie des exigences de la formation. Au-delà de ce cadre scolaire, BxlEvent a vocation à être exploité comme un service réel une fois le projet validé.": 'BxlEvent is een project dat oorspronkelijk werd gerealiseerd in het kader van een opleiding aan de EPFC, waarbij de implementatie op een publiek toegankelijke server deel uitmaakt van de opleidingseisen. Buiten dit schoolkader heeft BxlEvent de ambitie om als een echte dienst te worden geëxploiteerd zodra het project is goedgekeurd.'
