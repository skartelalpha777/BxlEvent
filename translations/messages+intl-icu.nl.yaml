'À propos': 'Over ons'
'A propos de BxlEvent': 'Over BxlEvent'
'BxlEvent est une plateforme dédiée aux événements récréatifs à Bruxelles et dans ses environs.': 'BxlEvent is een platform gewijd aan recreatieve evenementen in Brussel en omgeving.'
'Notre objectif est de vous aider à découvrir facilement les activités et sorties qui correspondent à vos envies.': 'Ons doel is u te helpen gemakkelijk activiteiten en uitjes te ontdekken die aansluiten bij uw wensen.'
'Notre projet': 'Ons project'
'Une plateforme pensée pour découvrir Bruxelles autrement': 'Een platform ontworpen om Brussel op een andere manier te ontdekken'
"BxlEvent a été développé dans le cadre d'un projet scolaire avec l'objectif de créer une plateforme permettant de centraliser différents événements récréatifs organisés à Bruxelles.": 'BxlEvent is ontwikkeld in het kader van een schoolproject met als doel een platform te creëren waarop verschillende recreatieve evenementen in Brussel gecentraliseerd worden.'
'Concerts, festivals, spectacles, expositions, événements sportifs ou encore activités de loisirs : notre plateforme rassemble différentes possibilités de sorties au même endroit.': 'Concerten, festivals, voorstellingen, tentoonstellingen, sportevenementen of vrijetijdsactiviteiten: ons platform verzamelt verschillende uitstapmogelijkheden op één plek.'
'Nous avons voulu proposer une interface simple et intuitive afin que chacun puisse trouver rapidement un événement, consulter ses informations et découvrir de nouvelles activités.': 'We wilden een eenvoudige en intuïtieve interface aanbieden, zodat iedereen snel een evenement kan vinden, de informatie kan bekijken en nieuwe activiteiten kan ontdekken.'
'Pourquoi BxlEvent ?': 'Waarom BxlEvent?'
"Bruxelles, une ville pleine d'événements": 'Brussel, een stad vol evenementen'
"Bruxelles propose de nombreuses activités tout au long de l'année. Pourtant, trouver un événement qui correspond à ses envies peut parfois nécessiter de consulter plusieurs sites.": 'Brussel biedt het hele jaar door talrijke activiteiten. Toch is het soms nodig om meerdere sites te raadplegen om een evenement te vinden dat bij uw wensen past.'
'BxlEvent a donc été imaginé pour simplifier cette recherche. Grâce aux catégories, aux filtres et aux informations détaillées de chaque événement, vous pouvez facilement explorer les sorties disponibles et préparer votre prochaine activité.': 'BxlEvent is daarom bedacht om deze zoektocht te vereenvoudigen. Dankzij categorieën, filters en gedetailleerde informatie over elk evenement kunt u eenvoudig de beschikbare uitjes verkennen en uw volgende activiteit voorbereiden.'
'Ce que vous pouvez trouver sur BxlEvent': 'Wat u op BxlEvent kunt vinden'
'Concerts & festivals': 'Concerten & festivals'
'Découvrez les artistes et événements musicaux qui se déroulent à Bruxelles.': 'Ontdek de artiesten en muziekevenementen die in Brussel plaatsvinden.'
'Spectacles & culture': 'Voorstellingen & cultuur'
'Théâtre, spectacles, expositions et autres rendez-vous culturels à ne pas manquer.': 'Theater, voorstellingen, tentoonstellingen en andere culturele afspraken die u niet mag missen.'
'Sports & loisirs': 'Sport & vrije tijd'
'Retrouvez les événements sportifs et activités de loisirs proposés dans la capitale.': 'Ontdek de sportevenementen en vrijetijdsactiviteiten die in de hoofdstad worden aangeboden.'
'Sorties & activités': 'Uitjes & activiteiten'
'Des idées de sorties pour profiter de Bruxelles seul, entre amis ou en famille.': 'Ideeën voor uitjes om alleen, met vrienden of in familieverband van Brussel te genieten.'
'Tout pour': 'Alles om'
'Vous aider à trouver votre prochaine sortie': 'u te helpen uw volgende uitje te vinden'
"Nous avons à cœur de rendre la recherche d'événements plus simple, claire et plus agréable. BxlEvent permet de parcourir les événements selon différents critères comme la catégorie, la date ou le lieu afin de trouver plus rapidement une activité qui vous correspond.": 'Het is onze prioriteit om het zoeken naar evenementen eenvoudiger, duidelijker en aangenamer te maken. Met BxlEvent kunt u evenementen doorbladeren op basis van criteria zoals categorie, datum of locatie, zodat u sneller een activiteit vindt die bij u past.'
"Une sélection d'événements récréatifs de qualité": 'Een selectie van kwalitatieve recreatieve evenementen'
'Des informations claires et mises à jour régulièrement': 'Duidelijke en regelmatig bijgewerkte informatie'
'Une interface simple, rapide et accessible à tous': 'Een eenvoudige, snelle en voor iedereen toegankelijke interface'
"Un projet réalisé avec passion et envie d'apprendre": 'Een project gerealiseerd met passie en leergierigheid'
'Une sortie vous attend peut-être!': 'Misschien wacht er een uitje op u!'
'Parcourez les évènements disponibles à Bruxelles et trouvez votre prochaine activité en quelques clics': 'Blader door de beschikbare evenementen in Brussel en vind uw volgende activiteit in enkele klikken'
'Découvrez les évènements': 'Ontdek de evenementen'
'Foire aux questions': 'Veelgestelde vragen'
'Retrouvez ici les réponses aux questions les plus fréquentes à propos de BxlEvent.': 'Vind hier de antwoorden op de meest gestelde vragen over BxlEvent.'
'Comment créer un compte sur BxlEvent ?': 'Hoe maak ik een account aan op BxlEvent?'
'Cliquez sur "S''inscrire" dans  de la page de connexion, remplissez le formulaire avec vos informations et validez votre inscription via l''e-mail que vous recevrez. Une fois votre compte activé, vous pourrez profiter de toutes les fonctionnalités.': 'Klik op "Registreren" op de inlogpagina, vul het formulier in met uw gegevens en bevestig uw registratie via de e-mail die u ontvangt. Zodra uw account geactiveerd is, kunt u van alle functies genieten.'
'Comment réserver un événement ?': 'Hoe reserveer ik een evenement?'
"Rendez-vous sur la page de l'événement qui vous intéresse, choisissez votre type de billet et la quantité, puis ajoutez-le au panier. Vous pourrez ensuite finaliser votre commande depuis votre panier.": 'Ga naar de pagina van het evenement dat u interesseert, kies uw type ticket en de hoeveelheid, en voeg het toe aan uw winkelmandje. Vervolgens kunt u uw bestelling afronden vanuit uw winkelmandje.'
'Puis-je annuler ou modifier ma réservation ?': 'Kan ik mijn reservering annuleren of wijzigen?'
"Les billets sont non remboursables sauf en cas d'annulation de l'événement.": 'Tickets zijn niet terugbetaalbaar, behalve bij annulering van het evenement.'
'Quels moyens de paiement acceptez-vous ?': 'Welke betaalmethoden accepteert u?'
'BxlEvent accepte les principales cartes bancaires ainsi que les moyens de paiement en ligne les plus courants. Toutes les transactions sont sécurisées.': 'BxlEvent accepteert de belangrijkste bankkaarten en de meest gangbare online betaalmethoden. Alle transacties zijn beveiligd.'
'Comment être informé des nouveaux événements ?': 'Hoe blijf ik op de hoogte van nieuwe evenementen?'
"Inscrivez-vous à notre newsletter depuis la page d'accueil pour recevoir chaque semaine une sélection des meilleurs événements à ne pas manquer à Bruxelles.": 'Schrijf u in voor onze nieuwsbrief via de startpagina om wekelijks een selectie van de beste evenementen in Brussel te ontvangen.'
'Mes données sont-elles sécurisées ?': 'Zijn mijn gegevens veilig?'
'Oui. Vos données personnelles et vos paiements sont traités de manière sécurisée et ne sont jamais partagés avec des tiers sans votre consentement.': 'Ja. Uw persoonsgegevens en betalingen worden veilig verwerkt en nooit met derden gedeeld zonder uw toestemming.'
"Je n'ai pas trouvé la réponse à ma question, que faire ?": 'Ik heb geen antwoord op mijn vraag gevonden, wat nu?'
"N'hésitez pas à nous contacter directement via notre page de contact, notre équipe se fera un plaisir de vous répondre rapidement.": 'Aarzel niet om ons rechtstreeks te contacteren via onze contactpagina, ons team beantwoordt u graag snel.'
'Comment télécharger mes billets ?': 'Hoe download ik mijn tickets?'
'Rendez-vous dans votre profil, section "Mes commandes & billets". Pour chaque commande payée, un bouton "Télécharger mes billets" vous permet de récupérer vos billets au format PDF.': 'Ga naar uw profiel, sectie "Mijn bestellingen & tickets". Voor elke betaalde bestelling kunt u via de knop "Mijn tickets downloaden" uw tickets als PDF ophalen.'
'Comment devenir organisateur et publier mon propre événement ?': 'Hoe word ik organisator en publiceer ik mijn eigen evenement?'
'Lors de votre inscription, choisissez le profil "Contributeur (Organisateur)". Vous pourrez ensuite publier vos propres événements et gérer votre programmation depuis votre compte.': 'Kies bij uw registratie het profiel "Bijdrager (Organisator)". Vervolgens kunt u uw eigen evenementen publiceren en uw programmering beheren vanuit uw account.'
'Comment signaler un problème avec un événement ?': 'Hoe meld ik een probleem met een evenement?'
'Si un événement vous semble incorrect, annulé ou frauduleux, vous pouvez le signaler directement depuis sa page. Notre équipe examine chaque signalement et vous tient informé du traitement de votre demande.': 'Als een evenement u onjuist, geannuleerd of frauduleus lijkt, kunt u dit rechtstreeks vanaf de pagina melden. Ons team onderzoekt elke melding en houdt u op de hoogte van de afhandeling van uw verzoek.'
'Vous avez encore une question ?': 'Heeft u nog een vraag?'
"Notre équipe est là pour vous aider. N'hésitez pas à nous contacter.": 'Ons team staat klaar om u te helpen. Aarzel niet om contact met ons op te nemen.'
'Nous contacter': 'Contacteer ons'
'Une question sur un événement à Bruxelles ? Notre équipe vous répond dans les plus brefs délais.': 'Een vraag over een evenement in Brussel? Ons team antwoordt u zo snel mogelijk.'
