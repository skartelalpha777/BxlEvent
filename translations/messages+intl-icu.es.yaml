Confidentialité: Privacidad
'BxlEvent accorde une grande importance à la protection de vos données personnelles. Cette page explique quelles données nous collectons, pourquoi, et quels sont vos droits.': 'BxlEvent concede gran importancia a la protección de sus datos personales. Esta página explica qué datos recopilamos, por qué, y cuáles son sus derechos.'
'1. Données collectées': '1. Datos recopilados'
"Lors de votre inscription et de l'utilisation du site, nous collectons les informations suivantes : nom, prénom, adresse e-mail, adresse postale (facultative) et, le cas échéant, les informations liées à vos commandes et billets.": 'Durante su registro y el uso del sitio, recopilamos la siguiente información: apellido, nombre, dirección de correo electrónico, dirección postal (opcional) y, en su caso, la información relacionada con sus pedidos y entradas.'
'2. Utilisation des données': '2. Uso de los datos'
'Ces données sont utilisées uniquement pour :': 'Estos datos se utilizan únicamente para:'
'Créer et gérer votre compte utilisateur ;': 'Crear y gestionar su cuenta de usuario;'
'Traiter vos commandes et générer vos billets ;': 'Procesar sus pedidos y generar sus entradas;'
'Vous envoyer la newsletter, si vous y êtes inscrit ;': 'Enviarle el boletín, si está suscrito;'
'Répondre à vos demandes via le formulaire de contact.': 'Responder a sus solicitudes a través del formulario de contacto.'
'3. Conservation des données': '3. Conservación de los datos'
'Vos données sont conservées uniquement le temps nécessaire aux finalités décrites ci-dessus, et supprimées  à la clôture de votre compte.': 'Sus datos se conservan únicamente durante el tiempo necesario para los fines descritos anteriormente, y se eliminan al cerrar su cuenta.'
'4. Vos droits': '4. Sus derechos'
"Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et de suppression de vos données. Vous pouvez à tout moment consulter et modifier vos informations depuis votre profil, ou nous contacter directement pour toute demande.": 'De conformidad con el RGPD, usted dispone de un derecho de acceso, rectificación y supresión de sus datos. Puede consultar y modificar su información desde su perfil en cualquier momento, o contactarnos directamente para cualquier solicitud.'
'5. Cookies': '5. Cookies'
"BxlEvent utilise uniquement des cookies techniques nécessaires au bon fonctionnement du site (ex : maintien de votre session et de votre panier). Aucun cookie publicitaire n'est utilisé.": 'BxlEvent utiliza únicamente cookies técnicas necesarias para el buen funcionamiento del sitio (por ejemplo: mantener su sesión y su carrito). No se utiliza ninguna cookie publicitaria.'
'6. Base légale du traitement': '6. Base legal del tratamiento'
'Les données personnelles sont traitées sur la base de différentes fondements juridiques prévus par le RGPD :.': 'Los datos personales se tratan sobre la base de diferentes fundamentos jurídicos previstos por el RGPD:.'
"l'exécution d'un contrat, notamment pour la création du compte et la gestion des commandes ;": 'la ejecución de un contrato, en particular para la creación de la cuenta y la gestión de los pedidos;'
"le consentement de l'utilisateur, notamment pour l'inscription à la newsletter ;": 'el consentimiento del usuario, en particular para la suscripción al boletín;'
"le respect d'obligations légales lorsque cela est nécessaire ;": 'el cumplimiento de obligaciones legales cuando sea necesario;'
"l'intérêt légitime de BxlEvent pour assurer la sécurité et le bon fonctionnement du site.": 'el interés legítimo de BxlEvent para garantizar la seguridad y el buen funcionamiento del sitio.'
'7. Destinataires des données': '7. Destinatarios de los datos'
"Les données personnelles sont uniquement accessibles aux personnes nécessaires au fonctionnement de BxlEvent. Elles peuvent notamment être transmises à nos prestataires techniques lorsque cela est nécessaire au fonctionnement du site, au traitement des paiements ou à l'envoi d'e-mails.": 'Los datos personales solo son accesibles para las personas necesarias para el funcionamiento de BxlEvent. Pueden transmitirse en particular a nuestros proveedores técnicos cuando sea necesario para el funcionamiento del sitio, el procesamiento de pagos o el envío de correos electrónicos.'
'8. Sécurité des données': '8. Seguridad de los datos'
"BxlEvent met en œuvre des mesures techniques et organisationnelles appropriées afin de protéger les données personnelles contre la perte, l'accès non autorisé, la modification ou la divulgation.": 'BxlEvent aplica medidas técnicas y organizativas apropiadas para proteger los datos personales contra la pérdida, el acceso no autorizado, la modificación o la divulgación.'
"9. Transfert des données hors de l'Union européenne": '9. Transferencia de datos fuera de la Unión Europea'
"Lorsque certains prestataires utilisés par BxlEvent peuvent traiter des données personnelles en dehors de l'Union européenne, nous veillons à ce que ces transferts soient réalisés conformément aux exigences du RGPD et bénéficient de garanties appropriées.": 'Cuando ciertos proveedores utilizados por BxlEvent puedan tratar datos personales fuera de la Unión Europea, nos aseguramos de que estas transferencias se realicen de conformidad con los requisitos del RGPD y cuenten con garantías apropiadas.'
'10. Modification de la politique de confidentialité': '10. Modificación de la política de privacidad'
"Cette politique de confidentialité peut être modifiée afin de tenir compte de l'évolution du site, de nos services ou de la réglementation applicable.": 'Esta política de privacidad puede modificarse para tener en cuenta la evolución del sitio, de nuestros servicios o de la normativa aplicable.'
