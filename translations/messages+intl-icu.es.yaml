'Vous vous engagez à fournir des informations exactes, à jour, et à les maintenir à jour depuis votre profil. Vous êtes responsable de la confidentialité de votre mot de passe et de toute activité effectuée depuis votre compte.': 'Usted se compromete a proporcionar información exacta y actualizada, y a mantenerla al día desde su perfil. Usted es responsable de la confidencialidad de su contraseña y de toda actividad realizada desde su cuenta.'
'3. Comportement des utilisateurs': '3. Comportamiento de los usuarios'
'En utilisant BxlEvent, vous vous engagez à :': 'Al utilizar BxlEvent, usted se compromete a:'
'Ne pas créer plusieurs comptes dans le but de contourner une restriction ;': 'No crear varias cuentas con el fin de eludir una restricción;'
"Ne pas publier de contenu trompeur, injurieux, illicite ou portant atteinte aux droits d'autrui ;": 'No publicar contenido engañoso, injurioso, ilícito o que vulnere los derechos de terceros;'
"Ne pas utiliser le site à des fins frauduleuses (fausses réservations, faux événements, usurpation d'identité) ;": 'No utilizar el sitio con fines fraudulentos (reservas falsas, eventos falsos, suplantación de identidad);'
'Respecter les autres utilisateurs et organisateurs.': 'Respetar a los demás usuarios y organizadores.'
"Tout utilisateur constatant un comportement abusif ou un événement suspect peut le signaler directement depuis la page de l'événement concerné.": 'Todo usuario que detecte un comportamiento abusivo o un evento sospechoso puede reportarlo directamente desde la página del evento en cuestión.'
'4. Fonctionnement des événements': '4. Funcionamiento de los eventos'
"Les événements affichés sur BxlEvent peuvent être créés par l'équipe BxlEvent ou publiés par des utilisateurs Contributeurs. Chaque événement passe par un statut de validation avant d'être visible publiquement, afin de limiter la publication de contenus non conformes.": 'Los eventos que aparecen en BxlEvent pueden ser creados por el equipo de BxlEvent o publicados por usuarios Colaboradores. Cada evento pasa por un estado de validación antes de ser visible públicamente, con el fin de limitar la publicación de contenidos no conformes.'
"Les Contributeurs sont responsables de l'exactitude des informations qu'ils publient (description, date, heure, lieu, catégories, tarifs des billets). Il leur appartient de tenir ces informations à jour, notamment en cas de report ou d'annulation.": 'Los Colaboradores son responsables de la exactitud de la información que publican (descripción, fecha, hora, lugar, categorías, precios de las entradas). Es su responsabilidad mantener esta información actualizada, en particular en caso de aplazamiento o cancelación.'
'5. Réservation et paiement des billets': '5. Reserva y pago de entradas'
"Toute commande de billets via BxlEvent est ferme dès sa confirmation. Les billets sont nominatifs et non transférables, sauf indication contraire de l'organisateur de l'événement. Après paiement, les billets sont accessibles au format PDF depuis votre profil.": 'Todo pedido de entradas a través de BxlEvent es firme desde su confirmación. Las entradas son personales e intransferibles, salvo indicación contraria del organizador del evento. Tras el pago, las entradas están disponibles en formato PDF desde su perfil.'
'6. Responsabilité de BxlEvent': '6. Responsabilidad de BxlEvent'
"BxlEvent agit en tant qu'intermédiaire technique entre les organisateurs et les participants. À ce titre, BxlEvent ne peut être tenu responsable :": 'BxlEvent actúa como intermediario técnico entre los organizadores y los participantes. Como tal, BxlEvent no puede ser considerado responsable de:'
"Du déroulement, du report ou de l'annulation d'un événement, ces responsabilités incombant à l'organisateur ;": 'El desarrollo, el aplazamiento o la cancelación de un evento, ya que estas responsabilidades corresponden al organizador;'
"De l'exactitude des informations publiées par les Contributeurs ;": 'La exactitud de la información publicada por los Colaboradores;'
"D'une interruption temporaire du site liée à la maintenance ou à un incident technique.": 'Una interrupción temporal del sitio relacionada con el mantenimiento o un incidente técnico.'
'BxlEvent met cependant tout en œuvre pour vérifier les événements publiés et retirer rapidement tout contenu signalé comme non conforme.': 'No obstante, BxlEvent hace todo lo posible para verificar los eventos publicados y retirar rápidamente cualquier contenido reportado como no conforme.'
"7. Suspension et suppression d'un compte": '7. Suspensión y eliminación de una cuenta'
'BxlEvent se réserve le droit de suspendre ou de supprimer, temporairement ou définitivement, tout compte ne respectant pas les présentes conditions générales, notamment en cas de comportement frauduleux, de publication de contenu non conforme ou de signalements répétés et justifiés.': 'BxlEvent se reserva el derecho de suspender o eliminar, temporal o definitivamente, toda cuenta que no respete los presentes términos y condiciones, en particular en caso de comportamiento fraudulento, publicación de contenido no conforme o reportes repetidos y justificados.'
'Vous pouvez également demander la suppression de votre compte à tout moment, en nous contactant via notre page de contact.': 'También puede solicitar la eliminación de su cuenta en cualquier momento, contactándonos a través de nuestra página de contacto.'
'8. Propriété intellectuelle': '8. Propiedad intelectual'
"L'ensemble des contenus du site (textes, logo, mise en page, charte graphique) est protégé et ne peut être reproduit sans autorisation préalable. Les contenus publiés par les Contributeurs (descriptions, visuels d'événements) restent leur propriété, mais sont mis à disposition de BxlEvent pour affichage sur la plateforme.": 'Todos los contenidos del sitio (textos, logotipo, diseño, identidad gráfica) están protegidos y no pueden reproducirse sin autorización previa. Los contenidos publicados por los Colaboradores (descripciones, imágenes de eventos) siguen siendo de su propiedad, pero se ponen a disposición de BxlEvent para su visualización en la plataforma.'
'9. Données personnelles': '9. Datos personales'
'Le traitement de vos données personnelles est détaillé dans notre': 'El tratamiento de sus datos personales se detalla en nuestra'
'10. Modification des conditions': '10. Modificación de las condiciones'
'BxlEvent se réserve le droit de modifier les présentes conditions générales à tout moment. La date de dernière mise à jour indiquée en haut de cette page permet de connaître la version en vigueur.': 'BxlEvent se reserva el derecho de modificar los presentes términos y condiciones en cualquier momento. La fecha de la última actualización indicada en la parte superior de esta página permite conocer la versión vigente.'
