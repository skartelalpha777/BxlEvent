'À propos': 'Acerca de'
'A propos de BxlEvent': 'Acerca de BxlEvent'
'BxlEvent est une plateforme dédiée aux événements récréatifs à Bruxelles et dans ses environs.': 'BxlEvent es una plataforma dedicada a los eventos recreativos en Bruselas y sus alrededores.'
'Notre objectif est de vous aider à découvrir facilement les activités et sorties qui correspondent à vos envies.': 'Nuestro objetivo es ayudarle a descubrir fácilmente las actividades y salidas que se ajustan a sus intereses.'
'Notre projet': 'Nuestro proyecto'
'Une plateforme pensée pour découvrir Bruxelles autrement': 'Una plataforma pensada para descubrir Bruselas de otra manera'
"BxlEvent a été développé dans le cadre d'un projet scolaire avec l'objectif de créer une plateforme permettant de centraliser différents événements récréatifs organisés à Bruxelles.": 'BxlEvent fue desarrollado en el marco de un proyecto escolar con el objetivo de crear una plataforma que permita centralizar diferentes eventos recreativos organizados en Bruselas.'
'Concerts, festivals, spectacles, expositions, événements sportifs ou encore activités de loisirs : notre plateforme rassemble différentes possibilités de sorties au même endroit.': 'Conciertos, festivales, espectáculos, exposiciones, eventos deportivos o actividades de ocio: nuestra plataforma reúne diferentes opciones de salidas en un mismo lugar.'
'Nous avons voulu proposer une interface simple et intuitive afin que chacun puisse trouver rapidement un événement, consulter ses informations et découvrir de nouvelles activités.': 'Quisimos ofrecer una interfaz simple e intuitiva para que cada persona pueda encontrar rápidamente un evento, consultar su información y descubrir nuevas actividades.'
'Pourquoi BxlEvent ?': '¿Por qué BxlEvent?'
"Bruxelles, une ville pleine d'événements": 'Bruselas, una ciudad llena de eventos'
"Bruxelles propose de nombreuses activités tout au long de l'année. Pourtant, trouver un événement qui correspond à ses envies peut parfois nécessiter de consulter plusieurs sites.": 'Bruselas ofrece numerosas actividades durante todo el año. Sin embargo, encontrar un evento que se ajuste a sus intereses a veces requiere consultar varios sitios.'
'BxlEvent a donc été imaginé pour simplifier cette recherche. Grâce aux catégories, aux filtres et aux informations détaillées de chaque événement, vous pouvez facilement explorer les sorties disponibles et préparer votre prochaine activité.': 'BxlEvent fue por tanto concebido para simplificar esta búsqueda. Gracias a las categorías, los filtros y la información detallada de cada evento, puede explorar fácilmente las salidas disponibles y preparar su próxima actividad.'
'Ce que vous pouvez trouver sur BxlEvent': 'Lo que puede encontrar en BxlEvent'
'Concerts & festivals': 'Conciertos y festivales'
'Découvrez les artistes et événements musicaux qui se déroulent à Bruxelles.': 'Descubra los artistas y eventos musicales que tienen lugar en Bruselas.'
'Spectacles & culture': 'Espectáculos y cultura'
'Théâtre, spectacles, expositions et autres rendez-vous culturels à ne pas manquer.': 'Teatro, espectáculos, exposiciones y otras citas culturales que no debe perderse.'
'Sports & loisirs': 'Deporte y ocio'
'Retrouvez les événements sportifs et activités de loisirs proposés dans la capitale.': 'Encuentre los eventos deportivos y actividades de ocio que se ofrecen en la capital.'
'Sorties & activités': 'Salidas y actividades'
'Des idées de sorties pour profiter de Bruxelles seul, entre amis ou en famille.': 'Ideas de salidas para disfrutar de Bruselas solo, con amigos o en familia.'
'Tout pour': 'Todo para'
'Vous aider à trouver votre prochaine sortie': 'ayudarle a encontrar su próxima salida'
"Nous avons à cœur de rendre la recherche d'événements plus simple, claire et plus agréable. BxlEvent permet de parcourir les événements selon différents critères comme la catégorie, la date ou le lieu afin de trouver plus rapidement une activité qui vous correspond.": 'Nos esforzamos por hacer que la búsqueda de eventos sea más simple, clara y agradable. BxlEvent permite explorar los eventos según diferentes criterios como la categoría, la fecha o el lugar, para encontrar más rápidamente una actividad que se ajuste a usted.'
"Une sélection d'événements récréatifs de qualité": 'Una selección de eventos recreativos de calidad'
'Des informations claires et mises à jour régulièrement': 'Información clara y actualizada regularmente'
'Une interface simple, rapide et accessible à tous': 'Una interfaz simple, rápida y accesible para todos'
"Un projet réalisé avec passion et envie d'apprendre": 'Un proyecto realizado con pasión y ganas de aprender'
'Une sortie vous attend peut-être!': '¡Quizás una salida le está esperando!'
'Parcourez les évènements disponibles à Bruxelles et trouvez votre prochaine activité en quelques clics': 'Explore los eventos disponibles en Bruselas y encuentre su próxima actividad en pocos clics'
'Découvrez les évènements': 'Descubra los eventos'
'Foire aux questions': 'Preguntas frecuentes'
'Retrouvez ici les réponses aux questions les plus fréquentes à propos de BxlEvent.': 'Encuentre aquí las respuestas a las preguntas más frecuentes sobre BxlEvent.'
'Comment créer un compte sur BxlEvent ?': '¿Cómo creo una cuenta en BxlEvent?'
'Cliquez sur "S''inscrire" dans  de la page de connexion, remplissez le formulaire avec vos informations et validez votre inscription via l''e-mail que vous recevrez. Une fois votre compte activé, vous pourrez profiter de toutes les fonctionnalités.': 'Haga clic en "Registrarse" en la página de inicio de sesión, complete el formulario con sus datos y confirme su registro a través del correo electrónico que recibirá. Una vez activada su cuenta, podrá disfrutar de todas las funciones.'
'Comment réserver un événement ?': '¿Cómo reservo un evento?'
"Rendez-vous sur la page de l'événement qui vous intéresse, choisissez votre type de billet et la quantité, puis ajoutez-le au panier. Vous pourrez ensuite finaliser votre commande depuis votre panier.": 'Vaya a la página del evento que le interesa, elija su tipo de entrada y la cantidad, y añádalo al carrito. A continuación, podrá finalizar su pedido desde el carrito.'
'Puis-je annuler ou modifier ma réservation ?': '¿Puedo cancelar o modificar mi reserva?'
"Les billets sont non remboursables sauf en cas d'annulation de l'événement.": 'Las entradas no son reembolsables, salvo en caso de cancelación del evento.'
'Quels moyens de paiement acceptez-vous ?': '¿Qué medios de pago aceptan?'
'BxlEvent accepte les principales cartes bancaires ainsi que les moyens de paiement en ligne les plus courants. Toutes les transactions sont sécurisées.': 'BxlEvent acepta las principales tarjetas bancarias, así como los medios de pago en línea más comunes. Todas las transacciones son seguras.'
'Comment être informé des nouveaux événements ?': '¿Cómo puedo enterarme de los nuevos eventos?'
"Inscrivez-vous à notre newsletter depuis la page d'accueil pour recevoir chaque semaine une sélection des meilleurs événements à ne pas manquer à Bruxelles.": 'Suscríbase a nuestro boletín desde la página de inicio para recibir cada semana una selección de los mejores eventos que no debe perderse en Bruselas.'
'Mes données sont-elles sécurisées ?': '¿Están seguros mis datos?'
'Oui. Vos données personnelles et vos paiements sont traités de manière sécurisée et ne sont jamais partagés avec des tiers sans votre consentement.': 'Sí. Sus datos personales y sus pagos se procesan de forma segura y nunca se comparten con terceros sin su consentimiento.'
"Je n'ai pas trouvé la réponse à ma question, que faire ?": 'No he encontrado la respuesta a mi pregunta, ¿qué hago?'
"N'hésitez pas à nous contacter directement via notre page de contact, notre équipe se fera un plaisir de vous répondre rapidement.": 'No dude en contactarnos directamente a través de nuestra página de contacto, nuestro equipo estará encantado de responderle rápidamente.'
'Comment télécharger mes billets ?': '¿Cómo descargo mis entradas?'
'Rendez-vous dans votre profil, section "Mes commandes & billets". Pour chaque commande payée, un bouton "Télécharger mes billets" vous permet de récupérer vos billets au format PDF.': 'Vaya a su perfil, sección "Mis pedidos y entradas". Para cada pedido pagado, un botón "Descargar mis entradas" le permite obtener sus entradas en formato PDF.'
'Comment devenir organisateur et publier mon propre événement ?': '¿Cómo puedo convertirme en organizador y publicar mi propio evento?'
'Lors de votre inscription, choisissez le profil "Contributeur (Organisateur)". Vous pourrez ensuite publier vos propres événements et gérer votre programmation depuis votre compte.': 'Al registrarse, elija el perfil "Colaborador (Organizador)". A continuación, podrá publicar sus propios eventos y gestionar su programación desde su cuenta.'
'Comment signaler un problème avec un événement ?': '¿Cómo reporto un problema con un evento?'
'Si un événement vous semble incorrect, annulé ou frauduleux, vous pouvez le signaler directement depuis sa page. Notre équipe examine chaque signalement et vous tient informé du traitement de votre demande.': 'Si un evento le parece incorrecto, cancelado o fraudulento, puede reportarlo directamente desde su página. Nuestro equipo examina cada reporte y le mantiene informado sobre el trámite de su solicitud.'
'Vous avez encore une question ?': '¿Tiene alguna otra pregunta?'
"Notre équipe est là pour vous aider. N'hésitez pas à nous contacter.": 'Nuestro equipo está aquí para ayudarle. No dude en contactarnos.'
'Nous contacter': Contáctenos
'Une question sur un événement à Bruxelles ? Notre équipe vous répond dans les plus brefs délais.': '¿Alguna pregunta sobre un evento en Bruselas? Nuestro equipo le responderá lo antes posible.'
'Contact Info': 'Información de contacto'
'Retrouvez-nous au cœur de la capitale ou contactez-nous directement.': 'Encuéntrenos en el corazón de la capital o contáctenos directamente.'
